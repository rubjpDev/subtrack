[project]
name = "subtrack-mcp"
version = "0.1.0"
description = "Thin FastMCP server over the subtrack-api Go backend."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
subtrack-mcp = "subtrack_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"